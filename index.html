  <!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<title>Ai-kata</title>

  <link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #f3f3f3;
  color: #111;
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
}

.app {
  max-width: 430px;
  min-height: 100vh;
  margin: auto;
  background: white;
  padding: 28px 22px 40px;
}

header {
  text-align: center;
  padding: 28px 0 30px;
}

.logo {
  font-size: 45px;
  font-weight: 300;
  letter-spacing: 3px;
}

.you-me {
  margin-top: 10px;
  font-size: 13px;
  letter-spacing: 5px;
}

.line {
  border: 0;
  border-top: 1px solid #ddd;
  margin: 20px 0 28px;
}

.label {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 1.5px;
}

.word {
  margin-top: 12px;
  font-size: 15px;
}

.heart { float: right; }

.card {
  border: 1px solid #ddd;
  border-radius: 18px;
  padding: 24px;
  margin: 28px 0 20px;
}

.big-date {
  font-size: 46px;
  font-weight: 300;
  margin: 20px 0 4px;
}

.day {
  font-size: 12px;
  letter-spacing: 2px;
}

.time {
  margin: 20px 0;
  font-size: 15px;
}

.status {
  display: inline-block;
  padding: 9px 15px;
  font-size: 10px;
  letter-spacing: 1.4px;
  border-radius: 5px;
}

.available {
  background: #111;
  color: white;
}

.maybe {
  background: #bbb;
  color: #111;
}

.busy {
  border: 1px solid #111;
  background: white;
}

.options {
  border-top: 1px solid #ddd;
  margin-top: 25px;
  padding-top: 20px;
  display: grid;
  grid-template-columns: repeat(3,1fr);
  text-align: center;
}

.option-icon { font-size: 21px; }
.option-text { font-size: 11px; margin-top: 7px; }

.menu-button, .back-button {
  width: 100%;
  padding: 17px;
  background: white;
  border: 1px solid #ddd;
  border-radius: 12px;
  margin: 6px 0;
  text-align: left;
  font-size: 13px;
  letter-spacing: 1px;
}

.arrow { float:right; }

.page { display:none; }
.page.active { display:block; }

/* CALENDAR */

.calendar-title {
  text-align:center;
  font-size: 22px;
  letter-spacing: 2px;
  margin: 10px 0 25px;
}

.week, .calendar {
  display:grid;
  grid-template-columns:repeat(7,1fr);
  text-align:center;
}

.week div {
  font-size:9px;
  letter-spacing:1px;
  margin-bottom:12px;
}

.date-button {
  border:0;
  background:white;
  height:48px;
  position:relative;
  font-size:14px;
}

.date-button.has-data {
  cursor:pointer;
}

.dot {
  width:5px;
  height:5px;
  border-radius:50%;
  background:#111;
  position:absolute;
  bottom:5px;
  left:50%;
  transform:translateX(-50%);
}

.dot.maybe-dot { background:#aaa; }

.busy-dot {
  background:white;
  border:1px solid #111;
}

.legend {
  border:1px solid #ddd;
  border-radius:15px;
  padding:16px;
  margin-top:25px;
}

.legend-row {
  display:flex;
  align-items:center;
  gap:12px;
  margin:10px 0;
  font-size:11px;
}

.legend-circle {
  width:14px;
  height:14px;
  border-radius:50%;
  background:#111;
}

.legend-circle.maybe-circle { background:#aaa; }

.legend-circle.busy-circle {
  background:white;
  border:1px solid #111;
}

footer {
  text-align:center;
  margin-top:50px;
  font-size:11px;
  letter-spacing:1px;
  color:#777;

.note {
  margin-top: 12px;
  margin-bottom: 8px;
  font-size: 14px;
  letter-spacing: 0.08em;
  color: #666;
}
  
</style>
</head>

<body>

<main class="app">

<!-- HOME -->
<section id="home" class="page active">

<header>
  <div class="logo">Ai-kata</div>
  <div class="you-me">NAOYA ↔ CHIAKI</div>
</header>

<hr class="line">

<div class="label">
TODAY'S WORD
<span class="heart">♥</span>
</div>

<div class="word">会える時間を、たいせつに。</div>

<div class="card" id="nextCard"></div>

<button class="menu-button" id="openSchedule">
SCHEDULE <span class="arrow">→</span>
</button>

<button class="menu-button">
PLACES <span class="arrow">→</span>
</button>

<button class="menu-button">
MEMORIES <span class="arrow">→</span>
</button>

  <button class="menu-button" id="openEdit">
EDIT <span class="arrow">→</span>
</button>

<footer>Ai-kata · our way to meet.</footer>

</section>


<!-- SCHEDULE -->
<section id="schedulePage" class="page">

<button class="back-button" data-page="home">← HOME</button>

<header>
  <div class="logo" style="font-size:28px">SCHEDULE</div>
</header>

<div class="calendar-title">2026 / 08</div>

<div class="week">
<div>MON</div><div>TUE</div><div>WED</div>
<div>THU</div><div>FRI</div><div>SAT</div><div>SUN</div>
</div>

<div id="calendar" class="calendar"></div>

<div class="legend">
<div class="legend-row">
<span class="legend-circle"></span> AVAILABLE
</div>
<div class="legend-row">
<span class="legend-circle maybe-circle"></span> MAYBE
</div>
<div class="legend-row">
<span class="legend-circle busy-circle"></span> BUSY
</div>
</div>

<footer>Tap a date to see details.</footer>

</section>

<!-- EDIT -->
<section id="editPage" class="page">

  <button class="back-button" data-page="home">← HOME</button>

  <header>
    <div class="logo" style="font-size:28px">EDIT SCHEDULE</div>
  </header>

  <div class="card">

    <label class="label">DATE</label>
    <input id="editDate" type="date">

    <div style="height:18px"></div>

    <label class="label">WORK</label>
    <select id="editWork">
      <option value="OFF">OFF</option>
      <option value="DAY SHIFT">DAY SHIFT</option>
      <option value="LATE SHIFT">LATE SHIFT</option>
      <option value="HALF DAY">HALF DAY</option>
    </select>

    <div style="height:18px"></div>

    <label class="label">STATUS</label>
    <select id="editStatus">
      <option value="available">AVAILABLE</option>
      <option value="maybe">MAYBE</option>
      <option value="busy">BUSY</option>
    </select>

    <div style="height:18px"></div>

    <label class="label">TIME</label>
    <input id="editTime" type="text" placeholder="NIGHT —">

    <div style="height:18px"></div>

    <label class="label">OPTIONS</label>

    <label>
      <input id="editHome" type="checkbox">
      HOME
    </label>

    <br>

    <label>
      <input id="editPickup" type="checkbox">
      PICKUP
    </label>

    <br>

    <label>
      <input id="editFood" type="checkbox">
      FOOD
    </label>

    <div style="height:18px"></div>

    <label class="label">NOTE</label>
    <input id="editNote" type="text" placeholder="予定など">

    <div style="height:22px"></div>

    <button class="menu-button" id="saveEdit">
      SAVE
    </button>

  </div>

</section>
  
<!-- DETAIL -->
<section id="detailPage" class="page">

<button class="back-button" data-page="schedulePage">← SCHEDULE</button>

<div id="detailCard"></div>

</section>

</main>


<script>

// 保存済みの予定があれば読み込む
const savedSchedule = localStorage.getItem("ai-kata-schedule");

if (savedSchedule) {
  const savedData = JSON.parse(savedSchedule);
  Object.assign(schedule, savedData);
}

/* =====================================================
        ★ 編集エリアここまで ★
===================================================== */


const pages = document.querySelectorAll(".page");

function showPage(id) {
  pages.forEach(page => page.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  window.scrollTo(0,0);
}


document.getElementById("openSchedule")
.addEventListener("click", () => showPage("schedulePage"));

  document.getElementById("openEdit")
.addEventListener("click", () => showPage("editPage"));
  
document.querySelectorAll(".back-button")
.forEach(button => {
  button.addEventListener("click", () => {
    showPage(button.dataset.page);
  });
});


/* NEXT AVAILABLE */

function findNextAvailable() {

  const today = new Date();
  today.setHours(0, 0, 0, 0);

  const dates = Object.keys(schedule)
    .filter(date => {
      const data = schedule[date];
      const scheduleDate = new Date(date + "T00:00:00");

      return (
        data.status === "available" &&
        scheduleDate >= today
      );
    })
    .sort();

  return dates[0];
}
function renderNext() {

  const date = findNextAvailable();

  if (!date) {
    document.getElementById("nextCard").innerHTML =
      "<div class='label'>NEXT AVAILABLE</div><p>Coming soon.</p>";
    return;
  }

  const data = schedule[date];
  const d = new Date(date + "T00:00:00");

  const month = d.getMonth()+1;
  const day = d.getDate();

  const weekdays =
    ["SUNDAY","MONDAY","TUESDAY","WEDNESDAY",
     "THURSDAY","FRIDAY","SATURDAY"];

  document.getElementById("nextCard").innerHTML = `
    <div class="label">NEXT AVAILABLE</div>

    <div class="big-date">${month} / ${day}</div>

    <div class="day">${weekdays[d.getDay()]}</div>

    <div class="day">${data.work || ""}</div>

    ${data.note ? `<div class="word">${data.note}</div>` : ""}

    <div class="time">${data.time}</div>

    <span class="status available">AVAILABLE</span>

    <div class="options">

      <div>
        <div class="option-icon">⌂</div>
        <div class="option-text">
        おうち ${data.home ? "OK" : "NG"}
        </div>
      </div>

      <div>
        <div class="option-icon">🚗</div>
        <div class="option-text">
        迎え ${data.pickup ? "OK" : "NG"}
        </div>
      </div>

      <div>
        <div class="option-icon">🍴</div>
        <div class="option-text">
        ごはん ${data.food ? "OK" : "NG"}
        </div>
      </div>

    </div>
  `;
}


/* CALENDAR */

function renderCalendar() {

  const calendar = document.getElementById("calendar");

  /* 2026/8/1 = Saturday
     Monday-start calendar → 5 blanks */

  for(let i=0;i<5;i++){
    calendar.insertAdjacentHTML("beforeend","<div></div>");
  }

  for(let day=1;day<=31;day++){

    const date =
      `2026-08-${String(day).padStart(2,"0")}`;

    const data = schedule[date];

    const button = document.createElement("button");
    button.className = "date-button";
    button.textContent = day;

    if(data){

      button.classList.add("has-data");

      const dot = document.createElement("span");
      dot.className = "dot";

      if(data.status === "maybe"){
        dot.classList.add("maybe-dot");
      }

      if(data.status === "busy"){
        dot.classList.add("busy-dot");
      }

      button.appendChild(dot);

      button.addEventListener("click", () => {
        showDetail(date);
      });
    }

    calendar.appendChild(button);
  }
}


/* DETAIL */

function showDetail(date){

  const data = schedule[date];

  const d = new Date(date + "T00:00:00");

  const weekdays =
    ["SUNDAY","MONDAY","TUESDAY","WEDNESDAY",
     "THURSDAY","FRIDAY","SATURDAY"];

  const statusText = data.status.toUpperCase();

  document.getElementById("detailCard").innerHTML = `

  <div class="card">

    <div class="big-date">
      ${d.getMonth()+1} / ${d.getDate()}
    </div>

    <div class="day">
      ${weekdays[d.getDay()]}
    </div>

    <div class="day">${data.work || ""}</div>

    ${data.note ? `<div class="note">${data.note}</div>` : ""}

    <div class="time">${data.time}</div>

    <span class="status ${data.status}">
      ${statusText}
    </span>

    <div class="options">

      <div>
        <div class="option-icon">⌂</div>
        <div class="option-text">
        おうち ${data.home ? "OK" : "NG"}
        </div>
      </div>

      <div>
        <div class="option-icon">🚗</div>
        <div class="option-text">
        迎え ${data.pickup ? "OK" : "NG"}
        </div>
      </div>

      <div>
        <div class="option-icon">🍴</div>
        <div class="option-text">
        ごはん ${data.food ? "OK" : "NG"}
        </div>
      </div>

    </div>

  </div>
  `;

  showPage("detailPage");
}

document.getElementById("saveEdit")
.addEventListener("click", () => {

  const date = document.getElementById("editDate").value;

  if (!date) {
    alert("日付を選んでね");
    return;
  }

  schedule[date] = {
    work: document.getElementById("editWork").value,
    status: document.getElementById("editStatus").value,
    time: document.getElementById("editTime").value || "—",
    note: document.getElementById("editNote").value,
    home: document.getElementById("editHome").checked,
    pickup: document.getElementById("editPickup").checked,
    food: document.getElementById("editFood").checked
  };

  localStorage.setItem(
  "ai-kata-schedule",
  JSON.stringify(schedule)
);

  alert("SAVED ✓");

  showPage("schedulePage");
});

renderNext();
renderCalendar();

</script>
