* { box-sizing: border-box; }

body {

header {

.logo {

.you-me {
  margin-top: 10px;

.line {
  border: 0;

}

.word {
  margin-top: 12px;
  font-size: 15px;
}

.heart { float: right; }

.card {
  border: 1px solid #ddd;
  border-radius: 18px;
  padding: 24px;

}

.big-date {
  font-size: 46px;
  font-weight: 300;
  margin: 20px 0 4px;
}

.day {
  font-size: 12px;
  letter-spacing: 2px;
}

.time {
  margin: 20px 0;
  font-size: 15px;
}

.status {
  display: inline-block;
  padding: 9px 15px;
  font-size: 10px;
  letter-spacing: 1.4px;
  border-radius: 5px;
}

.available {
  background: #40e0d0;
  color: white;
}

.maybe {
  background: #bbb;
  color: #111;
}

.busy {
  border: 1px solid #111;
  background: #111;
  color: white;
}

.options {
  border-top: 1px solid #ddd;
  margin-top: 25px;
  padding-top: 20px;
  display: grid;
  grid-template-columns: repeat(3,1fr);
  text-align: center;
}

.option-icon { font-size: 21px; }
.option-text { font-size: 11px; margin-top: 7px; }

.menu-button, .back-button {
  width: 100%;
  padding: 17px;
  background: white;
  border: 1px solid #ddd;
  border-radius: 12px;
  margin: 6px 0;
  text-align: left;
  font-size: 13px;
  letter-spacing: 1px;
}

.arrow { float:right; }

.page { display:none; }
.page.active { display:block; }

/* CALENDAR */

.calendar-title {
  text-align:center;
  font-size: 22px;
  letter-spacing: 2px;
  margin: 10px 0 25px;
}

.week, .calendar {
  display:grid;
  grid-template-columns:repeat(7,1fr);
  text-align:center;
}

.week div {
  font-size:9px;
  letter-spacing:1px;
  margin-bottom:12px;
}

.date-button {
  border:0;
  background:white;
  height:48px;
  position:relative;
  font-size:14px;
}

.date-button.has-data {
  cursor:pointer;
}

.dot {
  width:5px;
  height:5px;
  border-radius:50%;
  background:#40e0d0;
  position:absolute;
  bottom:5px;
  left:50%;
  transform:translateX(-50%);
}

.dot.maybe-dot { background:#aaa; }

.busy-dot {
  background:#111;
  border: none;
}

.legend {
  border:1px solid #ddd;
  border-radius:15px;
  padding:16px;
  margin-top:25px;
}

.legend-row {
  display:flex;
  align-items:center;
  gap:12px;
  margin:10px 0;
  font-size:11px;
}

.legend-circle {
  width:14px;
  height:14px;
  border-radius:50%;
  background:#40e0d0;
}

.legend-circle.maybe-circle { background:#aaa; }

.legend-circle.busy-circle {

  border:1px solid #111;
}

footer {

  font-size:11px;
  letter-spacing:1px;
  color:#777;

.note {

.compact-card {

}

.compact-card .big-date {
  font-size: 42px;

}

.compact-card .time {

 .swan-home {

.swan-home img {

.logo-wrap {

}
  
</style>

/* =====================================================

const pages = document.querySelectorAll(".page");

function showPage(id) {
  pages.forEach(page => page.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  window.scrollTo(0,0);
}


document.getElementById("openSchedule")
.addEventListener("click", () => showPage("schedulePage"));

  document.getElementById("openDrop")
  .addEventListener("click", () => showPage("dropPage"));

  document.getElementById("saveDrop")
  .addEventListener("click", async () => {
    const input = document.getElementById("dropInput");
    const text = input.value.trim();

    if (!text) {
      alert("ひとこと入れてね");
      return;
    }

    if (window.saveDropToCloud) {
      await window.saveDropToCloud(text);
      input.value = "";
      alert("DROPしました ✓");
    }
  });
  
  document.getElementById("openEdit")
.addEventListener("click", () => showPage("editPage"));
  
document.querySelectorAll(".back-button")
.forEach(button => {
  button.addEventListener("click", () => {
    showPage(button.dataset.page);
  });
});


/* NEXT AVAILABLE */

function findNextAvailable() {

  const today = new Date();
  today.setHours(0, 0, 0, 0);

  const dates = Object.keys(schedule)
    .filter(date => {
      const data = schedule[date];
      const scheduleDate = new Date(date + "T00:00:00");

      return (
        data.status === "available" &&
        scheduleDate > today
      );
    })
    .sort();

  return dates[0];
}
function renderNext() {

  const date = findNextAvailable();

  if (!date) {
    document.getElementById("nextCard").innerHTML =
      "<div class='label'>NEXT AVAILABLE</div><p>Coming soon.</p>";
    return;
  }

  const data = schedule[date];
  const d = new Date(date + "T00:00:00");

  const month = d.getMonth()+1;
  const day = d.getDate();

  const weekdays =
    ["SUNDAY","MONDAY","TUESDAY","WEDNESDAY",
     "THURSDAY","FRIDAY","SATURDAY"];

  document.getElementById("nextCard").innerHTML = `
    <div class="label">NEXT AVAILABLE</div>

    <div class="big-date">${month} / ${day}</div>

    <div class="day">${weekdays[d.getDay()]}</div>

    <div class="day">${data.work || ""}</div>

    ${data.note ? `<div class="word">${data.note}</div>` : ""}

    <div class="time">${data.time}</div>

  `;
}
function renderToday() {
  const now = new Date();

  const year = now.getFullYear();
  const monthNum = now.getMonth() + 1;
  const dayNum = now.getDate();

  const date =
    `${year}-${String(monthNum).padStart(2, "0")}-${String(dayNum).padStart(2, "0")}`;

  const data = schedule[date];

  const todayCard = document.getElementById("todayCard");

  const weekdays = [
    "SUNDAY", "MONDAY", "TUESDAY", "WEDNESDAY",
    "THURSDAY", "FRIDAY", "SATURDAY"
  ];

  if (!data) {
    todayCard.innerHTML = `
      <div class="label">TODAY</div>
      <div class="big-date">${monthNum} / ${dayNum}</div>
      <div class="day">${weekdays[now.getDay()]}</div>
      <div class="word">予定なし</div>
    `;
    return;
  }

  const status = data.status || "busy";

  todayCard.innerHTML = `
    <div class="label">TODAY</div>

    <div class="big-date">${monthNum} / ${dayNum}</div>

    <div class="day">${weekdays[now.getDay()]}</div>

    <div class="day">${data.work || ""}</div>

    ${data.note ? `<div class="word">${data.note}</div>` : ""}

    <div class="time">${data.time || ""}</div>

    <span class="status ${status}">
      ${status.toUpperCase()}
    </span>
  `;
}

/* CALENDAR */

function renderCalendar() {

  const calendar = document.getElementById("calendar");
  calendar.innerHTML = "";

  /* 2026/8/1 = Saturday
     Monday-start calendar → 5 blanks */

  for(let i=0;i<5;i++){
    calendar.insertAdjacentHTML("beforeend","<div></div>");
  }

  for(let day=1;day<=31;day++){

    const date =
      `2026-08-${String(day).padStart(2,"0")}`;

    const data = schedule[date];

    const button = document.createElement("button");
    button.className = "date-button";
    button.textContent = day;

    if(data){

      button.classList.add("has-data");

      const dot = document.createElement("span");
      dot.className = "dot";

      if(data.status === "maybe"){
        dot.classList.add("maybe-dot");
      }

      if(data.status === "busy"){
        dot.classList.add("busy-dot");
      }

      button.appendChild(dot);

      button.addEventListener("click", () => {
        showDetail(date);
      });
    }

    calendar.appendChild(button);
  }
}


/* DETAIL */

function showDetail(date){

  const data = schedule[date];

  const d = new Date(date + "T00:00:00");

  const weekdays =
    ["SUNDAY","MONDAY","TUESDAY","WEDNESDAY",
     "THURSDAY","FRIDAY","SATURDAY"];

  const statusText = data.status.toUpperCase();

  document.getElementById("detailCard").innerHTML = `

  <div class="card">

    <div class="big-date">
      ${d.getMonth()+1} / ${d.getDate()}
    </div>

    <div class="day">
      ${weekdays[d.getDay()]}
    </div>

    <div class="day">${data.work || ""}</div>

    ${data.note ? `<div class="note">${data.note}</div>` : ""}

    <div class="time">${data.time}</div>

    <span class="status ${data.status}">
      ${statusText}
    </span>

    <div class="options">

      <div>
        <div class="option-icon">⌂</div>
        <div class="option-text">
        おうち ${data.home ? "OK" : "NG"}
        </div>
      </div>

      <div>
        <div class="option-icon">🚗</div>
        <div class="option-text">
        迎え ${data.pickup ? "OK" : "NG"}
        </div>
      </div>

      <div>

        <div class="option-text">
        ごはん ${data.food ? "OK" : "NG"}
        </div>
      </div>

    </div>

  </div>
  `;

  showPage("detailPage");
}

document.getElementById("saveEdit")

  const date = document.getElementById("editDate").value;

  if (!date) {
    alert("日付を選んでね");
    return;
  }

  schedule[date] = {
    work: document.getElementById("editWork").value,
    status: document.getElementById("editStatus").value,
    time: document.getElementById("editTime").value || "—",
    note: document.getElementById("editNote").value,
    home: document.getElementById("editHome").checked,
    pickup: document.getElementById("editPickup").checked,
    food: document.getElementById("editFood").checked
  };
  if (window.saveScheduleToCloud) {
  window.saveScheduleToCloud(date, schedule[date]);
}

  localStorage.setItem(
  "ai-kata-schedule",
  JSON.stringify(schedule)
);
  renderToday();
  renderNext();
renderCalendar();

  alert("SAVED ✓");

  showPage("schedulePage");
});

renderToday();
renderNext();
renderCalendar();

window.schedule = schedule;
window.renderToday = renderToday;
window.renderNext = renderNext;
window.renderCalendar = renderCalendar;

window.saveScheduleToCloud = async function(date, data) {
  await setDoc(doc(db, "schedule", date), data);
};
  window.loadScheduleFromCloud = async function() {
  const snapshot = await getDocs(collection(db, "schedule"));

  snapshot.forEach((docSnap) => {
    window.schedule[docSnap.id] = docSnap.data();
  });

  window.renderToday();
  window.renderNext();
  window.renderCalendar();
};
window.saveDropToCloud = async function(text) {
  await addDoc(collection(db, "drops"), {
    text: text,
    createdAt: serverTimestamp()
  });
};
window.loadLatestDrop = async function() {
  const q = query(
    collection(db, "drops"),
    orderBy("createdAt", "desc"),
    limit(1)
  );

  const snapshot = await getDocs(q);

  const latestDrop = document.getElementById("latestDrop");

  if (snapshot.empty) {
    latestDrop.textContent = "まだDROPはありません。";
    return;
  }

  const data = snapshot.docs[0].data();
  latestDrop.textContent = data.text;
};
